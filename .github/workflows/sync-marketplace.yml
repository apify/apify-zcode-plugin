name: Sync plugin to ZCode marketplace

# Opens (or updates) a PR against zai-org/zcode-plugins that replaces
# external_plugins/apify/ with the apify/ directory of a commit of this repo and
# copies version and descriptions from apify/.zcode-plugin/plugin.json at that
# commit into the matching marketplace.json entry. Upstream only accepts in-repo sources (./external_plugins/<name>),
# so the plugin is copied rather than pinned by SHA; the source SHA is recorded in
# the PR title and body instead.
#
# release.yml calls this after every stable release. To re-sync manually, run it
# from the Actions tab: it copies the branch or tag picked in "Use workflow from".
#
# Prerequisites:
#   1. A fork of zai-org/zcode-plugins must exist at $FORK.
#   2. MARKETPLACE_PAT must be a PAT that can push to $FORK and create PRs in
#      $UPSTREAM (fine-grained tokens typically must be granted access to both
#      repositories).
#   3. The `apify` entry must already be merged upstream (update-only — it does
#      not create the entry on the first run).

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA of this repository to copy
        required: true
        type: string
      release_url:
        description: GitHub release URL linked from the upstream PR
        required: false
        type: string
    secrets:
      MARKETPLACE_PAT:
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: zai-org/zcode-plugins
  FORK: apify/zcode-plugins
  PLUGIN_NAME: apify
  PR_BRANCH: apify/update-plugin

jobs:
  sync-marketplace:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-marketplace
      cancel-in-progress: false
    steps:
      - name: Check out the plugin repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: plugin

      - name: Resolve the version and SHA to copy
        id: plugin
        working-directory: plugin
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          VERSION="$(jq -r '.version' apify/.zcode-plugin/plugin.json)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Copying ${PLUGIN_NAME} ${VERSION} at ${SHA}"

      - name: Check out the apify fork of zcode-plugins
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.FORK }}
          persist-credentials: false
          path: marketplace
          fetch-depth: 0

      - name: Sync fork's main onto upstream main
        working-directory: marketplace
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream main
          git checkout -B main upstream/main

      - name: Copy the plugin and update the marketplace entry
        id: update
        working-directory: marketplace
        run: |
          set -euo pipefail

          # Update-only: bail out cleanly if the entry isn't upstream yet.
          if ! jq -e --arg n "$PLUGIN_NAME" 'any(.plugins[]; .name == $n)' marketplace.json >/dev/null; then
            echo "::warning::No '$PLUGIN_NAME' entry found in $UPSTREAM yet — submit the first PR manually. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected_source="./external_plugins/${PLUGIN_NAME}"
          actual_source="$(jq -r --arg n "$PLUGIN_NAME" '.plugins[] | select(.name == $n) | .source' marketplace.json)"
          if [ "$actual_source" != "$expected_source" ]; then
            echo "::error::Expected the '$PLUGIN_NAME' entry source to be '$expected_source', found '$actual_source'."
            exit 1
          fi

          rsync -a --delete --exclude '.DS_Store' "../plugin/${PLUGIN_NAME}/" "external_plugins/${PLUGIN_NAME}/"

          # Upstream's validator requires the entry's version and description_i18n
          # to equal the manifest's, so carry those (and description) over together.
          jq --indent 2 --arg n "$PLUGIN_NAME" \
            --slurpfile m "external_plugins/${PLUGIN_NAME}/.zcode-plugin/plugin.json" \
            '(.plugins[] | select(.name == $n)) |= (
               .version = $m[0].version
               | .description = $m[0].description
               | .description_i18n = $m[0].description_i18n)' \
            marketplace.json > marketplace.json.tmp
          mv marketplace.json.tmp marketplace.json

          others='.plugins | map(select(.name != env.PLUGIN_NAME))'
          if [ "$(git show HEAD:marketplace.json | jq -c "$others")" != "$(jq -c "$others" marketplace.json)" ]; then
            git diff marketplace.json
            echo "::error::Rewriting marketplace.json changed entries other than '$PLUGIN_NAME'."
            exit 1
          fi

          python3 scripts/validate.py

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Open or update the marketplace PR
        if: steps.update.outputs.skip != 'true'
        working-directory: marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          VERSION: ${{ steps.plugin.outputs.version }}
          PLUGIN_SHA: ${{ steps.plugin.outputs.sha }}
          SHORT_SHA: ${{ steps.plugin.outputs.short_sha }}
          RELEASE_URL: ${{ inputs.release_url }}
        run: |
          set -euo pipefail

          git add -A marketplace.json "external_plugins/${PLUGIN_NAME}"
          if git diff --cached --quiet; then
            echo "zcode-plugins already has ${PLUGIN_NAME} ${VERSION} (${PLUGIN_SHA}); nothing to do."
            exit 0
          fi

          git config user.name "apify-bot"
          git config user.email "actions@apify.com"
          git checkout -B "$PR_BRANCH"
          git commit -m "chore(${PLUGIN_NAME}): update plugin to v${VERSION} (${SHORT_SHA})"
          gh auth setup-git
          git push --force-with-lease origin "$PR_BRANCH"

          fork_owner="${FORK%%/*}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${PLUGIN_SHA}"
          title="chore(${PLUGIN_NAME}): update plugin to v${VERSION} (${SHORT_SHA})"
          # Mirrors the required "Plugin type" section of upstream's PR template.
          body="## Plugin type (required)"$'\n\n'
          body+="- [ ] **UI Plugin**"$'\n'
          body+="- [x] **Standard plugin** — does not provide MCP Apps interactive pages"$'\n'
          body+="- [ ] **Not applicable**"$'\n\n'
          body+="Affected plugin name(s): \`${PLUGIN_NAME}\`"$'\n\n'
          body+="## What"$'\n\n'
          body+="Automated update of the \`${PLUGIN_NAME}\` plugin to version \`${VERSION}\`, copied from [\`${SHORT_SHA}\`](${commit_url}) by the \`sync-marketplace\` workflow in \`${GITHUB_REPOSITORY}\`. \`python3 scripts/validate.py\` passed in that workflow."
          if [ -n "${RELEASE_URL:-}" ]; then
            body+=$'\n\n'"Release notes: ${RELEASE_URL}"
          fi

          # `gh pr list --head` rejects "owner:branch", so filter the fork owner separately.
          existing="$(gh pr list --repo "$UPSTREAM" \
            --head "$PR_BRANCH" --base main --state open \
            --json number,headRepositoryOwner \
            --jq "map(select(.headRepositoryOwner.login == \"${fork_owner}\"))[0].number // empty")"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$UPSTREAM" --title "$title" --body "$body"
            echo "Updated existing PR #${existing}."
          else
            gh pr create --repo "$UPSTREAM" \
              --base main \
              --head "${fork_owner}:${PR_BRANCH}" \
              --title "$title" \
              --body "$body"
          fi
